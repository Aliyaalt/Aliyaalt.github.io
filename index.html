<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aliya Alt — визитка</title>
  <style>
    :root {
      --bg: #f4f1ec;
      --card: #ffffff;
      --text: #1f1d1a;
      --muted: #6b665e;
      --accent: #c2410c;
      --line: #e5e0d8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161514;
        --card: #1f1e1c;
        --text: #f0ede8;
        --muted: #a39e95;
        --accent: #fb923c;
        --line: #33312d;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      max-width: 560px;
      width: 100%;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 32px;
      font-weight: 700;
      flex-shrink: 0;
    }

    h1 { font-size: 28px; line-height: 1.2; }
    .role { color: var(--accent); font-weight: 600; margin-top: 4px; }

    h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 28px 0 10px;
    }

    p { color: var(--text); }

    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .card { padding: 28px 22px; }
      .header { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="header">
      <div class="avatar">AA</div>
      <div>
        <h1>Aliya Alt</h1>
        <div class="role">PM</div>
      </div>
    </div>

    <h2>Обо мне</h2>
    <p>Тай-тай бастым</p>

    <footer>© 2026 Aliya Alt</footer>
  </main>
</body>
</html>
